name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to emit version-tuple for (backfill mode; leave empty for normal dispatch)"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract tag message
        id: tag
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git tag -l --format='%(contents)' ${{ github.ref_name }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag.outputs.message }}
          generate_release_notes: true
          files: dist/*

      - name: Strip leading v from tag
        run: echo "VALUE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: continuonai/rcan-spec/.github/actions/emit-version-tuple@v3.2.3
        with:
          project: robot-md-gateway
          ran: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_RAN }}
          field: gateway_version
          value: ${{ env.VALUE }}
          depends_on: '{"manifest_spec_version":">=1.5.0","protocol_version":">=3.2.0"}'
          pq_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PQ_PRIV }}
          pq_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          ed25519_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PRIV }}
          ed25519_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          release_tag: ${{ github.ref_name }}

  pypi-publish:
    # Auto-fires on v*.*.* tag push. Uses PyPI Trusted Publishing (OIDC) —
    # no token checked into the repo. PyPI looks up a pending/configured
    # publisher matching owner/repo/workflow/environment and mints a
    # short-lived credential for this run only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  emit-cert-report:
    # Run the gateway-authority emit script on tag push, sign the resulting
    # JSON with the gateway release Ed25519 key, and attach it to both the
    # workflow artifacts and the GitHub release. Plan 6 Phase 2 Task 12.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run cert tests + emit signed gateway-authority report
        env:
          GATEWAY_RELEASE_PRIV: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PRIV }}
          GATEWAY_RELEASE_KID: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
        run: |
          python -m pytest tests/cert/ --tb=short
          umask 077
          printf '%s' "$GATEWAY_RELEASE_PRIV" > /tmp/release.pem
          chmod 600 /tmp/release.pem
          python scripts/emit_gateway_authority_report.py \
            --repo robot-md-gateway \
            --sha ${{ github.sha }} \
            --out-dir dist/cert-reports \
            --signing-key-pem /tmp/release.pem \
            --kid "$GATEWAY_RELEASE_KID"
          rm -f /tmp/release.pem
      - name: Upload signed cert report (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gateway-authority-report-signed
          path: dist/cert-reports/*.json
          if-no-files-found: error
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cert-reports/*.json

  backfill-emit:
    name: Emit signed version-tuple envelope (backfill)
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.tag.outputs.tag }}" \
              --title "robot-md-gateway ${{ steps.tag.outputs.tag }}" \
              --generate-notes
          fi

      - uses: continuonai/rcan-spec/.github/actions/emit-version-tuple@v3.2.3
        with:
          project: robot-md-gateway
          ran: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_RAN }}
          field: gateway_version
          value: ${{ steps.tag.outputs.version }}
          depends_on: '{"manifest_spec_version":">=1.5.0","protocol_version":">=3.2.0"}'
          pq_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PQ_PRIV }}
          pq_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          ed25519_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PRIV }}
          ed25519_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          release_tag: ${{ steps.tag.outputs.tag }}
