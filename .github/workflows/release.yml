name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract tag message
        id: tag
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git tag -l --format='%(contents)' ${{ github.ref_name }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag.outputs.message }}
          generate_release_notes: true
          files: dist/*

      - name: Strip leading v from tag
        run: echo "VALUE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: continuonai/rcan-spec/.github/actions/emit-version-tuple@v3.2.0
        with:
          project: robot-md-dispatcher
          ran: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_RAN }}
          field: gateway_version
          value: ${{ env.VALUE }}
          depends_on: '{"manifest_spec_version":">=1.5.0","protocol_version":">=3.2.0"}'
          pq_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PQ_PRIV }}
          pq_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          ed25519_signing_key: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_PRIV }}
          ed25519_kid: ${{ secrets.ROBOT_MD_DISPATCHER_RELEASE_KID }}
          release_tag: ${{ github.ref_name }}

  pypi-publish:
    # Auto-fires on v*.*.* tag push. Uses PyPI Trusted Publishing (OIDC) —
    # no token checked into the repo. PyPI looks up a pending/configured
    # publisher matching owner/repo/workflow/environment and mints a
    # short-lived credential for this run only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
