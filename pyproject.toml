[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-md-gateway"
version = "0.5.0a5"
description = "Enforcement gateway for the OpenCastor stack — receives signed RCAN action envelopes, verifies manifest provenance, applies tier policy + tool allowlist, dispatches to drivers. Mandatory exclusive path between agent intent and any actuator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "craigm26", email = "craigm26@gmail.com" }]
keywords = ["robotics", "robot-md", "rcan", "gateway", "safety", "enforcement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "claude-agent-sdk>=0.1",
    "cryptography>=41",  # Ed25519 signing in cert/* + emit script
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-frontmatter>=1.0",
    "pydantic>=2.6",
    "rcan>=3.4.0",
    "jsonschema>=4.0",
]
# NOTE: `robot-md` is intentionally NOT a hard runtime dependency. The gateway
# core (serve / verify / sign / actuate) never imports it; it is used ONLY by the
# optional `init` wizard (init_wizard.py::_validate_robot_md), behind a lazy
# `try: from robot_md ... except ImportError` that already tells the user to
# `pip install robot-md`. Keeping it hard created a circular dependency
# (robot-md depends on robot-md-gateway). It now lives in the [init] extra (and
# [dev] so the wizard tests run). Install the wizard with
# `pip install robot-md-gateway[init]`.

[project.optional-dependencies]
init = ["robot-md>=1.1"]  # the `robot-md-gateway init` wizard's ROBOT.md validator
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.1",
    "robot-md>=1.1",  # init_wizard tests exercise the real robot_md parser/validator
]

[project.scripts]
robot-md-gateway = "robot_md_gateway.__main__:main"
robot-md-dispatcher = "robot_md_gateway._legacy_cli:legacy_main"
platatlas-shipper = "robot_md_gateway.shipper:main"

[project.entry-points."robot_md_gateway.actuators"]
noop = "robot_md_gateway.actuator:NoOpActuator"

[project.urls]
Homepage = "https://robotmd.dev"
Repository = "https://github.com/RobotRegistryFoundation/robot-md-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_md_gateway", "src/robot_md_dispatcher"]

[tool.hatch.build.targets.wheel.force-include]
"src/robot_md_gateway/udev/99-robot-md-gateway.rules.in" = "robot_md_gateway/udev/99-robot-md-gateway.rules.in"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # FastAPI `Depends` is idiomatic as a parameter default (same pattern as Typer
  # in sibling robot-md projects).
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
