[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-md-gateway"
version = "0.3.0a1"
description = "Enforcement gateway for the OpenCastor stack — receives signed RCAN action envelopes, verifies manifest provenance, applies tier policy + tool allowlist, dispatches to drivers. Mandatory exclusive path between agent intent and any actuator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "craigm26", email = "craigm26@gmail.com" }]
keywords = ["robotics", "robot-md", "rcan", "gateway", "safety", "enforcement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "claude-agent-sdk>=0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-frontmatter>=1.0",
    "pydantic>=2.6",
    "robot-md>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.1",
]

[project.scripts]
robot-md-gateway = "robot_md_gateway.__main__:main"
robot-md-dispatcher = "robot_md_gateway._legacy_cli:legacy_main"

[project.urls]
Homepage = "https://robotmd.dev"
Repository = "https://github.com/RobotRegistryFoundation/robot-md-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_md_gateway", "src/robot_md_dispatcher"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # FastAPI `Depends` is idiomatic as a parameter default (same pattern as Typer
  # in sibling robot-md projects).
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
